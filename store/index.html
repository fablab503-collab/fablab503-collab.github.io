<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'self'" />
    <script>
      (function () {
        var l = null;
        try { l = localStorage.getItem('lang'); } catch (e) {}
        if (l !== 'fr' && l !== 'en') {
          var langs = navigator.languages || [navigator.language || ''];
          l = 'en';
          for (var i = 0; i < langs.length; i++) {
            var c = String(langs[i]).toLowerCase();
            if (c.indexOf('fr') === 0) { l = 'fr'; break; }
            if (c.indexOf('en') === 0) { l = 'en'; break; }
          }
        }
        var target = l === 'fr' ? '/fr/boutique/' : '/en/store/';
        location.replace(target + location.search + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="1; url=/en/store/" />
    <title>Store · D-CREATIONS</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center;
        padding: 16px; background: #000000; color: #ffffff;
      }
      h1 { font-weight: 300; text-transform: uppercase; letter-spacing: -0.02em; }
      a {
        display: inline-block; margin: 8px; padding: 12px 22px; border-radius: 999px;
        background: #e6e6e6; color: #0a0a0a; text-decoration: none; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>D-CREATIONS</h1>
      <p>
        <a href="/fr/boutique/" hreflang="fr" lang="fr">Boutique (FR)</a>
        <a href="/en/store/" hreflang="en" lang="en">Store (EN)</a>
      </p>
    </main>
  </body>
</html>
