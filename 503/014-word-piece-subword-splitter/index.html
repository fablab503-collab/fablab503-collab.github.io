// -----------------------------------------------------------------------------
// Tokenizer
// -----------------------------------------------------------------------------

function wordPieceTokenize(text, vocab) {
  const set = new Set(vocab);
  const tokens = [];
  const words = text.trim().split(/\s+/);

  for (const word of words) {
    if (!word) continue;
    let remaining = word;
    let isStart = true;

    while (remaining) {
      let found = false;
      const maxLen = Math.min(remaining.length, 100);
      for (let len = maxLen; len > 0; len--) {
        const cand = remaining.substring(0, len);
        if (set.has(cand)) {
          tokens.push({ token: isStart ? cand : '##' + cand, type: isStart ? 'root' : 'subword' });
          remaining = remaining.substring(len);
          isStart = false;
          found = true;
          break;
        }
      }
      if (!found) {
        const ch = remaining[0];
        tokens.push({ token: isStart ? ch : '##' + ch, type: set.has(ch) ? (isStart ? 'root' : 'subword') : 'unk' });
        remaining = remaining.substring(1);
        isStart = false;
      }
    }
  }
  return tokens;
}

// -----------------------------------------------------------------------------
// Rendering
// -----------------------------------------------------------------------------

function formatTokens(tokens) {
  return tokens.map(t => {
    const cls = 'token ' + t.type;
    return '<span class="' + cls + '">' + esc(t.token) + '</span>';
  }).join('');
}

function esc(t) {
  return t.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"":'&quot;',"'":"&#039;"}[m]));
}

// -----------------------------------------------------------------------------
// Metrics
// -----------------------------------------------------------------------------

function calcMetrics(tokens) {
  const total = tokens.length;
  const root = tokens.filter(t => t.type === 'root').length;
  const subword = tokens.filter(t => t.type === 'subword').length;
  const unk = tokens.filter(t => t.type === 'unk').length;
  const oovPct = total ? ((unk / total) * 100).toFixed(1) : '0';
  return { total, root, subword, unk, oovPct };
}

function loadSavedInput() {
  try { const s = localStorage.getItem('wp014-input'); if (s) document.getElementById('input').value = s; } catch(e){}
}
function saveInputToStorage(t) {
  try { localStorage.setItem('wp014-input', t); } catch(e){}
}

// -----------------------------------------------------------------------------
// Initialization
// -----------------------------------------------------------------------------

(function init() {
  loadSavedInput();
  const input   = document.getElementById('input');
  const output  = document.getElementById('output');
  const stats   = document.getElementById('stats');
  const btn     = document.getElementById('tokenize');
  const vocab   = window.WordPieceVocab;

  btn.onclick = function() {
    const text = input.value.trim();
    saveInputToStorage(text);
    if (!text) {
      output.innerHTML = '<em>Enter text to tokenize...</em>';
      stats.textContent = '';
      return;
    }
    const tokens = wordPieceTokenize(text, vocab);
    output.innerHTML = formatTokens(tokens);
    const m = calcMetrics(tokens);
    stats.innerHTML = 
      '<span><b>Total tokens:</b> ' + m.total + '</span>' +
      '<span><b>Root words:</b> ' + m.root + '</span>' +
      '<span><b>Subwords:</b> ' + m.subword + '</span>' +
      '<span><b>OOV:</b> ' + m.unk + ' (' + m.oovPct + '%)</span>';
  };

  input.onkeydown = function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      btn.click();
      e.preventDefault();
    }
  };
})();
