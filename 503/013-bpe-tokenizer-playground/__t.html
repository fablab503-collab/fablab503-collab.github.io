  <div class="container">
    <a href="/503/" class="back-link">← Project 503</a>
    <h1>Bpe Tokenizer Playground</h1>
    <textarea id="input-text" placeholder="Enter text to tokenize...">Hello world, this is a test of byte-pair encoding.</textarea>
    <button id="tokenize-btn">Tokenize Text</button>
    <div class="output">
      <div id="tokens-output"></div>
      <div id="stats-output" class="stats"></div>
    </div>
    <div id="merge-steps" class="merge-steps"></div>
  </div>
  <footer>
    Project #13 of 503 · Daniel Madac, D-CREATIONS
  </footer>

  <script>
    const inputText = document.getElementById('input-text');
    const tokenizeBtn = document.getElementById('tokenize-btn');
    const tokensOutput = document.getElementById('tokens-output');
    const statsOutput = document.getElementById('stats-output');
    const mergeSteps = document.getElementById('merge-steps');

    // Initialize vocabulary with basic characters
    let vocab = new Map();
    let merges = [];

    function initializeVocab(text) {
      vocab.clear();
      merges = [];
      
      // Add all unique characters as initial tokens
      for (let char of text) {
        if (!vocab.has(char)) {
          const id = vocab.size;
          vocab.set(char, id);
        }
      }
      
      // Add special tokens
      vocab.set('<unk>', vocab.size);
      vocab.set('<pad>', vocab.size);
    }

    function getVocabSize() {
      return vocab.size;
    }

    function encode(text) {
      // Simple BPE-like encoding
      const tokens = [];
      const words = text.split(/\s+/).filter(w => w.length > 0);
      
      for (const word of words) {
        let chars = [...word];
        if (chars.length === 0) continue;
        
        // Start with character-level tokens
        let tokenList = chars.map(c => vocab.get(c));
        
        // Apply merges step by step
        const steps = [];
        while (tokenList.length > 1) {
          let minPair = null;
          let minCount = Infinity;
          
          for (let i = 0; i < tokenList.length - 1; i++) {
            const pair = `${tokenList[i]}_${tokenList[i+1]}`;
            if (merges.includes(pair)) {
              const count = merges.filter(p => p === pair).length;
              if (count < minCount) {
                minCount = count;
                minPair = [i, i + 1];
              }
            }
          }
          
          if (!minPair) break;
          
          const [i, j] = minPair;
          const newToken = `${tokenList[i]}_${tokenList[j]}`;
          merges.push(newToken);
          steps.push({
            from: [tokenList[i], tokenList[j]],
            to: newToken
          });
          
          // Replace pair with new token
          tokenList.splice(i, 2, tokenList[i] + '_' + tokenList[j]);
        }
        
        tokens.push(...tokenList);
      }
      
      return { tokens, steps };
    }

    function tokenize() {
      const text = inputText.value.trim();
      if (!text) return;
      
      initializeVocab(text);
      const result = encode(text);
      
      // Display tokens
      tokensOutput.innerHTML = '';
      const tokenContainer = document.createElement('div');
      tokenContainer.className = 'tokens';
      
      result.tokens.forEach(token => {
        const span = document.createElement('span');
        span.className = 'token';
        span.textContent = token;
        tokenContainer.appendChild(span);
      });
      
      tokensOutput.appendChild(tokenContainer);
      
      // Display stats
      const originalLength = text.length;
      const tokenCount = result.tokens.length;
      const compressionRatio = (originalLength / tokenCount).toFixed(2);
      
      statsOutput.innerHTML = `
        Original length: ${originalLength} characters<br>
        Token count: ${tokenCount}<br>
        Compression ratio: ${compressionRatio}:1
      `;
      
      // Display merge steps
      mergeSteps.innerHTML = '<h3>Merge Steps</h3>';
      result.steps.forEach((step, index) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step';
        stepDiv.textContent = `Step ${index + 1}: Merge ${step.from[0]} and ${step.from[1]} into ${step.to}`;
        mergeSteps.appendChild(stepDiv);
      });
    }

    tokenizeBtn.addEventListener('click', tokenize);

    // Initialize on load
    window.addEventListener('load', () => {
      try {
        const savedText = localStorage.getItem('bpe_text');
        if (savedText) inputText.value = savedText;
      } catch (e) {}
      
      tokenize();
    });

    // Save text to localStorage
    inputText.addEventListener('input', () => {
      try {
        localStorage.setItem('bpe_text', inputText.value);
      } catch (e) {}
    });
  </script>
