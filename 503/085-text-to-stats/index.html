<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text To Stats · Project 503 · D-CREATIONS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://dcreations.fr/503/085-text-to-stats/">
<meta name="description" content="Text To Stats computes a full text statistics dashboard — characters, words, sentences, paragraphs and unique words — right in your browser.">
<style>
:root {
  --bg: #f4f4f2;
  --card: #fff;
  --text: #111;
  --text-2: #5a5a5a;
  --line: #e2e2de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --card: #1c1c1c;
    --text: #f2f2f2;
    --text-2: #a8a8a8;
    --line: #2c2c2c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 48px;
}
.back {
  display: inline-block;
  margin: 12px 0 20px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 14px;
}
.back:hover { color: var(--text); text-decoration: underline; }
h1 {
  font-size: 24px;
  margin: 0 0 4px;
}
.sub {
  color: var(--text-2);
  font-size: 14px;
  margin: 0 0 20px;
}
textarea {
  width: 100%;
  min-height: 180px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 15px;
  resize: vertical;
}
textarea:focus {
  outline: 2px solid var(--text-2);
  outline-offset: 1px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 12px;
  text-align: center;
}
.stat .num {
  display: block;
  font-size: 26px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stat .lbl {
  display: block;
  font-size: 12px;
  color: var(--text-2);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
footer {
  margin-top: 32px;
  color: var(--text-2);
  font-size: 13px;
  text-align: center;
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/503/">← Project 503</a>
  <h1>Text To Stats</h1>
  <p class="sub">Type or paste text and see its statistics instantly. Everything runs locally in your browser — nothing is sent anywhere.</p>
  <textarea id="input" placeholder="Type or paste your text here…" aria-label="Text to analyse"></textarea>
  <div class="stats">
    <div class="stat"><span class="num" id="chars">0</span><span class="lbl">Characters</span></div>
    <div class="stat"><span class="num" id="words">0</span><span class="lbl">Words</span></div>
    <div class="stat"><span class="num" id="sentences">0</span><span class="lbl">Sentences</span></div>
    <div class="stat"><span class="num" id="paragraphs">0</span><span class="lbl">Paragraphs</span></div>
    <div class="stat"><span class="num" id="unique">0</span><span class="lbl">Unique words</span></div>
  </div>
  <footer>Project #85 of 503 · Daniel Madac, D-CREATIONS</footer>
</div>
<script>
(function () {
  var input = document.getElementById('input');
  var els = {
    chars: document.getElementById('chars'),
    words: document.getElementById('words'),
    sentences: document.getElementById('sentences'),
    paragraphs: document.getElementById('paragraphs'),
    unique: document.getElementById('unique')
  };
  var KEY = 't2s-text';

  function load() {
    try {
      var saved = localStorage.getItem(KEY);
      if (saved) { input.value = saved; }
    } catch (e) { /* storage unavailable */ }
  }

  function save() {
    try {
      localStorage.setItem(KEY, input.value);
    } catch (e) { /* storage unavailable */ }
  }

  function compute() {
    var text = input.value;

    var chars = text.length;

    var words = text.match(/\S+/g) || [];
    var wordCount = words.length;

    var sentences = text.match(/[^.!?\n]+[.!?]+(\s|$)|[^.!?\n]+$/g) || [];
    var sentenceCount = text.trim() === '' ? 0 : sentences.length;

    var paragraphs = text.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(function (p) { return p !== ''; });
    var paragraphCount = paragraphs.length;

    var seen = Object.create(null);
    var uniqueCount = 0;
    for (var i = 0; i < words.length; i++) {
      var w = words[i].toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
      if (w !== '' && !seen[w]) {
        seen[w] = true;
        uniqueCount++;
      }
    }

    els.chars.textContent = chars;
    els.words.textContent = wordCount;
    els.sentences.textContent = sentenceCount;
    els.paragraphs.textContent = paragraphCount;
    els.unique.textContent = uniqueCount;
  }

  input.addEventListener('input', function () {
    compute();
    save();
  });

  load();
  compute();
})();
</script>
</body>
</html>
