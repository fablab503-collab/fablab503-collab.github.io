<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Score Calculator · Project 503 · D-CREATIONS</title>
  <meta name="description" content="Calculate a composite score for each device based on CPU, GPU, memory, and battery.">
  <link rel="canonical" href="https://dcreations.fr/503/050-device-score-calculator/">
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #fff;
      --text: #111;
      --text-2: #5a5a5a;
      --line: #e2e2de;
      --shadow: rgba(0,0,0,.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card: #1c1c1c;
        --text: #f2f2f2;
        --text-2: #a8a8a8;
        --line: #2c2c2c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: .5rem; }
    a { color: var(--text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { background-color: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 4px var(--shadow); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .25rem; font-weight: 500; }
    input, select { width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 4px; background-color: var(--card); color: var(--text); }
    button { background-color: var(--text); color: var(--card); border: none; border-radius: 4px; padding: .75rem 1.5rem; cursor: pointer; font-weight: 500; }
    button:hover { opacity: .9; }
    .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .result-card { background-color: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; text-align: center; }
    .score { font-size: 2rem; font-weight: bold; margin: .5rem 0; }
    .device-name { font-weight: 500; }
    .footer { text-align: center; margin-top: 2rem; color: var(--text-2); font-size: .9rem; }
    @media (max-width: 375px) {
      body { padding: .5rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/503/">← Project 503</a>
      <h1>Device Score Calculator</h1>
      <p>Calculate a composite score for each device based on CPU, GPU, memory, and battery.</p>
    </header>

    <main>
      <div class="card">
        <form id="deviceForm">
          <div class="form-group">
            <label for="deviceName">Device Name</label>
            <input type="text" id="deviceName" required placeholder="e.g. iPhone 14 Pro">
          </div>
          <div class="form-group">
            <label for="cpuScore">CPU Score (0-100)</label>
            <input type="number" id="cpuScore" min="0" max="100" required>
          </div>
          <div class="form-group">
            <label for="gpuScore">GPU Score (0-100)</label>
            <input type="number" id="gpuScore" min="0" max="100" required>
          </div>
          <div class="form-group">
            <label for="memoryScore">Memory Score (0-100)</label>
            <input type="number" id="memoryScore" min="0" max="100" required>
          </div>
          <div class="form-group">
            <label for="batteryScore">Battery Score (0-100)</label>
            <input type="number" id="batteryScore" min="0" max="100" required>
          </div>
          <button type="submit">Calculate Score</button>
        </form>
      </div>

      <div class="card">
        <h2>Device Scores</h2>
        <div id="resultsContainer" class="results"></div>
      </div>
    </main>

    <footer class="footer">
      Project #50 of 503 · Daniel Madac, D-CREATIONS
    </footer>
  </div>

  <script>
    const form = document.getElementById('deviceForm');
    const resultsContainer = document.getElementById('resultsContainer');

    function calculateScore(cpu, gpu, memory, battery) {
      return Math.round((cpu + gpu + memory + battery) / 4);
    }

    function saveDevice(device) {
      try {
        const devices = JSON.parse(localStorage.getItem('devices') || '[]');
        devices.push(device);
        localStorage.setItem('devices', JSON.stringify(devices));
      } catch (e) {
        console.error('Failed to save device:', e);
      }
    }

    function loadDevices() {
      try {
        return JSON.parse(localStorage.getItem('devices') || '[]');
      } catch (e) {
        console.error('Failed to load devices:', e);
        return [];
      }
    }

    function renderResults(devices) {
      resultsContainer.innerHTML = '';
      if (devices.length === 0) {
        resultsContainer.innerHTML = '<p>No devices calculated yet.</p>';
        return;
      }

      devices.forEach(device => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="device-name">${device.name}</div>
          <div class="score">${device.score}</div>
          <div>CPU: ${device.cpuScore}</div>
          <div>GPU: ${device.gpuScore}</div>
          <div>Memory: ${device.memoryScore}</div>
          <div>Battery: ${device.batteryScore}</div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('deviceName').value;
      const cpu = parseInt(document.getElementById('cpuScore').value);
      const gpu = parseInt(document.getElementById('gpuScore').value);
      const memory = parseInt(document.getElementById('memoryScore').value);
      const battery = parseInt(document.getElementById('batteryScore').value);
      
      const score = calculateScore(cpu, gpu, memory, battery);
      
      const device = {
        name,
        cpuScore: cpu,
        gpuScore: gpu,
        memoryScore: memory,
        batteryScore: battery,
        score
      };
      
      saveDevice(device);
      renderResults(loadDevices());
      
      form.reset();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderResults(loadDevices());
    });
  </script>
</body>
</html>
