<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element 0</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230F172A'/><text x='16' y='22' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif' font-weight='800' font-size='18'>E</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Montserrat:wght@500;600;700&family=Overpass:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">E</div>
      <div class="brand-title">ELEMENT 0</div>
    </div>
    <div class="topbar-right">
    <div id="battery" class="battery" hidden title="Puck battery">
      <span class="battery-body"><span id="battery-fill" class="battery-fill"></span></span>
      <span id="battery-text" class="battery-text"></span>
    </div>
    <button
      id="settings-btn"
      class="settings-btn"
      type="button"
      aria-label="Settings"
      aria-expanded="false"
      aria-controls="settings-panel"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    </div>
  </header>

  <aside id="settings-panel" class="settings-panel" hidden>
    <div class="panel-row">
      <span class="panel-label">Status</span>
      <span id="status-pill" class="status-pill sim">
        <span class="status-dot"></span>
        <span id="status-text">Simulation</span>
      </span>
    </div>

    <div class="ble-actions">
      <button id="btn-connect" class="btn btn-primary" type="button">Connect puck</button>
      <button id="btn-reconnect" class="btn" type="button" hidden>Reconnect</button>
      <button id="btn-disconnect" class="btn" type="button" hidden>Disconnect</button>
    </div>

    <div id="ble-error" class="ble-error" hidden></div>

    <div class="panel-divider"></div>

    <div class="panel-row">
      <span class="panel-label">Storage / Battery</span>
      <span id="sd-line" class="sd-value">SD 29.5 GB, 29.5 free</span>
    </div>

    <div class="panel-row">
      <span class="panel-label">Face language</span>
      <div class="seg-group" role="group" aria-label="Language">
        <button id="lang-en" class="seg-btn active" type="button" data-lang="en">EN</button>
        <button id="lang-fr" class="seg-btn" type="button" data-lang="fr">FR</button>
      </div>
    </div>

    <div class="panel-row">
      <span class="panel-label">Simulation mode</span>
      <label class="switch" aria-label="Simulation mode">
        <input id="sim-toggle" type="checkbox" checked>
        <span class="switch-slider"></span>
      </label>
    </div>

    <div class="panel-divider"></div>

    <button id="btn-reset-view" class="btn" type="button">Reset view</button>
  </aside>

  <main id="stage"></main>

  <div id="display-controls" class="display-controls" hidden>
    <div class="hw-buttons">
      <button
        id="btn-boot"
        class="round-hw-btn"
        type="button"
        title="Click: next • Double-click: prev • Long-press: faces"
      >
        BOOT
      </button>
      <button
        id="btn-pwr"
        class="round-hw-btn"
        type="button"
        title="Click: confirm • Long-press: off"
      >
        PWR
      </button>
    </div>
    <button id="btn-back-3d" class="back-3d-btn" type="button">Back to 3D (Esc)</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
